name: Generate Pinnacle Road Waze Feed

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

env:
  WORKER_URL: "https://raspy-credit-5bf6.eva-7bd.workers.dev/"

permissions:
  contents: write

concurrency:
  group: pinnacle-road-waze-feed
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Retrieve road status from Cloudflare Worker
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          worker_url = os.environ["WORKER_URL"]

          try:
              request = urllib.request.Request(
                  worker_url,
                  headers={
                      "Accept": "application/json",
                      "User-Agent": "Wellington-Park-Waze-Feed/1.0"
                  }
              )

              with urllib.request.urlopen(request, timeout=30) as response:
                  worker_data = json.loads(
                      response.read().decode("utf-8")
                  )

          except Exception as error:
              print(f"Failed to retrieve Worker data: {error}")
              sys.exit(1)

          if not isinstance(worker_data, dict):
              print("Worker response was not a JSON object.")
              sys.exit(1)

          road_status = str(
              worker_data.get("status", "")
          ).strip()

          if not road_status:
              print("Worker response did not contain a status.")
              sys.exit(1)

          with open(
              "road_status.json",
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  worker_data,
                  file,
                  indent=2,
                  ensure_ascii=False
              )

          print(f"Road status: {road_status}")
          print(
              "Last updated: "
              + str(worker_data.get("updated", "Not supplied"))
          )
          print(
              "Closed gate: "
              + str(worker_data.get("closedGate", "Not supplied"))
          )
          PY

      - name: Generate Waze feed
        run: python waze_feed.py

      - name: Validate generated feed
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          feed_path = "dist/waze_closure_feed.json"

          if not os.path.exists(feed_path):
              print(f"Feed not found: {feed_path}")
              sys.exit(1)

          try:
              with open(
                  feed_path,
                  "r",
                  encoding="utf-8"
              ) as file:
                  feed = json.load(file)

          except Exception as error:
              print(f"Could not read generated feed: {error}")
              sys.exit(1)

          incidents = feed.get("incidents")

          if not isinstance(incidents, list):
              print("Feed does not contain an incidents list.")
              sys.exit(1)

          print(
              f"Feed validated with {len(incidents)} incident(s)."
          )
          PY

      - name: Display generated feed
        run: cat dist/waze_closure_feed.json

      - name: Deploy feed to GitHub Pages branch
        uses: JamesIves/github-pages-deploy-action@v4.7.3
        with:
          folder: dist
          branch: gh-pages
          clean: true
